# Fly.io config (alternative to Render): always-on with a persistent volume, ~2-3 USD/month.
#   fly launch --no-deploy --copy-config   # then: fly volumes create data --size 1 --region fra
#   fly secrets set HOST_KEY=<long random string>
#   fly deploy
app = "gtc-games"
primary_region = "fra"

[build]

[env]
  NODE_ENV = "production"
  DATA_DIR = "/data"
  PORT = "3000"

[mounts]
  source = "data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
